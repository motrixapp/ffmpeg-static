          install -m 0644 "build/${TARGET}/build-info.json" "$stage/build-info.json"
          install -m 0644 sources.env "$stage/sources.env"
          if [[ "$PLATFORM" == win32 ]]; then
            mkdir -p "$stage/work/link-maps"
            for evidence in \
              ffmpeg.map \
              ffmpeg.link-trace.txt \
              ffprobe.map \
              ffprobe.link-trace.txt; do
              install -m 0644 \
                "build/${TARGET}/work/link-maps/${evidence}" \
                "$stage/work/link-maps/${evidence}"
            done
          fi

      - name: Upload independent clean rebuild
        id: upload-rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-rebuild-${{ matrix.target }}
          path: build/rebuild-input/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 36
          compression-level: 0

      - name: Record independent rebuild artifact binding
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-rebuild.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-rebuild.outputs.artifact-id }}
          ARTIFACT_NAME: independent-rebuild-${{ matrix.target }}
          HEAD_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json, os, pathlib, re
          artifact_id = os.environ["ARTIFACT_ID"]
          digest = os.environ["ARTIFACT_DIGEST"].lower()
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("upload-artifact returned an invalid rebuild identity")
          path = pathlib.Path("build/rebuild-bindings") / f"{os.environ['TARGET']}.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "schemaVersion": 1,
              "target": os.environ["TARGET"],
              "artifactName": os.environ["ARTIFACT_NAME"],
              "artifactId": int(artifact_id),
              "artifactDigest": digest,
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "headSha": os.environ["HEAD_SHA"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload independent rebuild binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-rebuild-binding-${{ matrix.target }}
          path: build/rebuild-bindings/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 36

