# SECURITY CONTROL PLANE: a production release is only a workflow_dispatch from
# protected main in the canonical motrixapp/ffmpeg-static repository with
# release_tag set. A tag-push run is deliberately unsigned
# and unprivileged. Repository rulesets must make release tags immutable, restrict
# their creation, require their commits on protected main, and protect every
# repository path with catch-all CODEOWNERS coverage. The macos-release-signing,
# release-manifest-signing, and github-release environments require agalwood's
# manual confirmation. The single-maintainer profile permits self-review;
# administrator bypass remains disabled. See CONTRIBUTING.md.
name: Build and release

on:
  push:
    tags:
      - 'v*-motrix.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing protected tag to sign and publish; leave empty for unsigned artifacts
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ffmpeg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-sources:
    name: Authenticate and bind release inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      ffmpeg-version: ${{ steps.release.outputs.ffmpeg_version }}
      release-version: ${{ steps.release.outputs.release_version }}
      release-tag: ${{ steps.release.outputs.release_tag }}
      formal-release: ${{ steps.release.outputs.formal_release }}
      event-commit: ${{ steps.trust.outputs.event_commit }}
      release-created: ${{ steps.trust.outputs.release_created }}
      tag-object-sha: ${{ steps.trust.outputs.tag_object_sha }}
      tag-signer-fingerprint: ${{ steps.trust.outputs.tag_signer_fingerprint }}
      core-artifact-id: ${{ steps.upload-core.outputs.artifact-id }}
      core-artifact-digest: ${{ steps.upload-core.outputs.artifact-digest }}
      toolchain-artifact-id: ${{ steps.upload-toolchain.outputs.artifact-id }}
      toolchain-artifact-digest: ${{ steps.upload-toolchain.outputs.artifact-digest }}
      sources-artifact-id: ${{ steps.upload-sources.outputs.artifact-id }}
      sources-artifact-digest: ${{ steps.upload-sources.outputs.artifact-digest }}
    steps:
      - name: Check out trusted workflow control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the requested release subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          path: release-subject
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the protected control plane and locked release identity
        id: release
        env:
          CONTROL_REF: ${{ github.ref }}
          CONTROL_REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONTROL_SHA: ${{ github.sha }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          formal_release=false
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$DEFAULT_BRANCH" == main && "$CONTROL_REF" == refs/heads/main ]] || {
              echo "formal releases require main to remain the canonical default branch" >&2
              exit 1
            }
            [[ "$CONTROL_REF_PROTECTED" == true ]] || {
              echo "formal releases must be dispatched from protected main" >&2
              exit 1
            }
            formal_release=true
          fi
          FORMAL_RELEASE=$formal_release /usr/bin/python3 -I - <<'PY'
          import os
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          from pipeline_lib import load_sources, release_tag, release_version

          sources = load_sources(pathlib.Path("release-subject/sources.env"))
          tag = release_tag(sources)
          requested = os.environ.get("REQUESTED_TAG", "")
          if requested and requested != tag:
              raise SystemExit(f"requested tag {requested!r} does not match locked tag {tag!r}")
          if os.environ["GITHUB_EVENT_NAME"] == "push" and (
              os.environ["EVENT_REF_TYPE"] != "tag" or os.environ["EVENT_REF_NAME"] != tag
          ):
              raise SystemExit("pushed tag does not match the locked release tag")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"ffmpeg_version={sources['FFMPEG_VERSION']}\n")
              output.write(f"release_version={release_version(sources)}\n")
              output.write(f"release_tag={tag}\n")
              output.write(f"formal_release={os.environ['FORMAL_RELEASE']}\n")
          PY

      - name: Bind requested remote tag to the subject commit
        id: trust
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          CONTROL_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EXPECTED_REPOSITORY: motrixapp/ffmpeg-static
          EXPECTED_RELEASE_TAGGER_EMAIL: ${{ vars.EXPECTED_RELEASE_TAGGER_EMAIL }}
          EXPECTED_RELEASE_TAG_SIGNER_FINGERPRINT: ${{ vars.EXPECTED_RELEASE_TAG_SIGNER_FINGERPRINT }}
          FORMAL_RELEASE: ${{ steps.release.outputs.formal_release }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_TAG_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          event_commit=$(git -C release-subject rev-parse 'HEAD^{commit}')
          [[ "$event_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'event_commit=%s\n' "$event_commit" >>"$GITHUB_OUTPUT"
          control_commit=$(git rev-parse "${CONTROL_SHA}^{commit}")
          [[ "$control_commit" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$FORMAL_RELEASE" != true ]]; then
            CONTROL_CREATED=$(git show -s --format=%cI "$control_commit") /usr/bin/python3 -I - <<'PY'
          import datetime
          import os
          import pathlib

          raw_created = os.environ["CONTROL_CREATED"]
          try:
              created = datetime.datetime.fromisoformat(raw_created.replace("Z", "+00:00"))
          except ValueError as error:
              raise SystemExit("control commit has an invalid committer timestamp") from error
          if created.tzinfo is None:
              raise SystemExit("control commit timestamp is missing a timezone")
          canonical_created = created.astimezone(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release_created={canonical_created}\n")
          PY
            exit 0
          fi
          [[ "$event_commit" == "$control_commit" ]] || {
            echo "formal release tag must point to the exact protected main dispatch commit" >&2
            exit 1
          }
          [[ "$ACTUAL_REPOSITORY" == "$EXPECTED_REPOSITORY" &&
             "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
            echo "release event did not originate from the canonical repository" >&2
            exit 1
          }

          verify_remote_tag() {
            local direct peeled resolved refs
            refs=$(git ls-remote origin \
              "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
            # The awk field references are intentionally literal.
            # shellcheck disable=SC2016
            direct=$(awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }' <<<"$refs")
            # The awk field references are intentionally literal.
            # shellcheck disable=SC2016
            peeled=$(awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1 }' <<<"$refs")
            resolved=${peeled:-$direct}
            [[ -n "$direct" && -n "$peeled" && "$resolved" == "$event_commit" ]] || {
              echo "remote release tag does not resolve to the event commit" >&2
              exit 1
            }
            [[ -n "$EXPECTED_RELEASE_TAGGER_EMAIL" && "$EXPECTED_RELEASE_TAGGER_EMAIL" != *$'\n'* ]]
            [[ "$EXPECTED_RELEASE_TAG_SIGNER_FINGERPRINT" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]] || {
              echo "release tag signer fingerprint is missing or invalid" >&2
              exit 1
            }
            mkdir -p -- build
            gh api "repos/${EXPECTED_REPOSITORY}/git/tags/${direct}" >build/release-tag-object.json
            tag_verify_dir=$(mktemp -d "${RUNNER_TEMP}/release-tag-gpg.XXXXXX")
            chmod 700 "$tag_verify_dir"
            TAG_OBJECT_SHA=$direct EVENT_COMMIT=$event_commit TAG_VERIFY_DIR=$tag_verify_dir /usr/bin/python3 -I - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          tag = json.loads(pathlib.Path("build/release-tag-object.json").read_text(encoding="utf-8"))
          verification = tag.get("verification") or {}
          target = tag.get("object") or {}
          tagger = tag.get("tagger") or {}
          if tag.get("sha") != os.environ["TAG_OBJECT_SHA"]:
              raise SystemExit("GitHub tag object identity mismatch")
          if tag.get("tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("annotated tag object name does not match the release ref")
          if target.get("type") != "commit" or target.get("sha") != os.environ["EVENT_COMMIT"]:
              raise SystemExit("annotated tag does not directly target the release commit")
          if verification.get("verified") is not True or verification.get("reason") != "valid":
              raise SystemExit("annotated release tag signature is not valid")
          signature = verification.get("signature")
          payload = verification.get("payload")
          public_key = os.environ.get("RELEASE_TAG_SIGNING_PUBLIC_KEY", "")
          if not isinstance(signature, str) or not signature or len(signature) > 131072:
              raise SystemExit("annotated tag lacks a bounded detached signature")
          if not isinstance(payload, str) or not payload or len(payload) > 1048576:
              raise SystemExit("annotated tag lacks a bounded signed payload")
          header_text, separator, _message = payload.partition("\n\n")
          if not separator:
              raise SystemExit("annotated tag signed payload has no header boundary")
          headers = {}
          for line in header_text.splitlines():
              key, space, value = line.partition(" ")
              if not space or key in headers:
                  raise SystemExit("annotated tag signed payload has malformed headers")
              headers[key] = value
          if (
              headers.get("object") != os.environ["EVENT_COMMIT"]
              or headers.get("type") != "commit"
              or headers.get("tag") != os.environ["RELEASE_TAG"]
          ):
              raise SystemExit("annotated tag signed payload identity mismatch")
          if not public_key or len(public_key) > 131072:
              raise SystemExit("release tag signing public key is missing or oversized")
          verify_dir = pathlib.Path(os.environ["TAG_VERIFY_DIR"])
          material = {
              "signature.asc": signature,
              "payload.txt": payload,
              "public-key.asc": public_key,
          }
          for name, contents in material.items():
              path = verify_dir / name
              path.write_bytes(contents.encode("utf-8"))
              path.chmod(0o600)
          if tagger.get("email") != os.environ["EXPECTED_RELEASE_TAGGER_EMAIL"]:
              raise SystemExit("annotated release tag has an unexpected signed tagger email")
          raw_created = tagger.get("date")
          if not isinstance(raw_created, str):
              raise SystemExit("annotated release tag is missing its tagger timestamp")
          try:
              created = datetime.datetime.fromisoformat(raw_created.replace("Z", "+00:00"))
          except ValueError as error:
              raise SystemExit("annotated release tag has an invalid tagger timestamp") from error
          if created.tzinfo is None or created.utcoffset() != datetime.timedelta(0):
              raise SystemExit("annotated release tag timestamp must be UTC")
          canonical_created = created.astimezone(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release_created={canonical_created}\n")
              output.write(f"tag_object_sha={os.environ['TAG_OBJECT_SHA']}\n")
              output.write(
                  "tag_signer_fingerprint="
                  f"{os.environ['EXPECTED_RELEASE_TAG_SIGNER_FINGERPRINT']}\n"
              )
          PY
            if ! gpg --batch --no-autostart --homedir "$tag_verify_dir" --quiet \
              --import "$tag_verify_dir/public-key.asc" >/dev/null 2>&1; then
              echo "could not import the pinned release tag signing public key" >&2
              exit 1
            fi
            mapfile -t tag_key_fingerprints < <(
              gpg --batch --no-autostart --homedir "$tag_verify_dir" --with-colons \
                --list-keys 2>/dev/null \
                | awk -F: '$1 == "pub" {want=1; next} want && $1 == "fpr" {print toupper($10); want=0}'
            )
            (( ${#tag_key_fingerprints[@]} == 1 )) \
              && [[ "${tag_key_fingerprints[0]}" == "$EXPECTED_RELEASE_TAG_SIGNER_FINGERPRINT" ]] || {
              echo "release tag public key does not match the pinned fingerprint" >&2
              exit 1
            }
            tag_status="$tag_verify_dir/verify.status"
            if ! gpg --batch --no-autostart --no-auto-key-retrieve \
              --homedir "$tag_verify_dir" --status-fd=1 \
              --verify "$tag_verify_dir/signature.asc" "$tag_verify_dir/payload.txt" \
              >"$tag_status" 2>/dev/null; then
              echo "release tag did not verify with the pinned OpenPGP key" >&2
              exit 1
            fi
            if ! awk -v expected="$EXPECTED_RELEASE_TAG_SIGNER_FINGERPRINT" '
              $2 == "VALIDSIG" && ($10 == 8 || $10 == 9 || $10 == 10) \
                && (toupper($3) == expected || toupper($NF) == expected) { valid++ }
              $2 == "BADSIG" || $2 == "ERRSIG" || $2 == "NO_PUBKEY" \
                || $2 == "EXPSIG" || $2 == "EXPKEYSIG" || $2 == "REVKEYSIG" \
                || $2 == "KEYEXPIRED" || $2 == "SIGEXPIRED" { invalid = 1 }
              END { exit !(valid == 1 && !invalid) }
            ' "$tag_status"; then
              echo "release tag signature fingerprint validation failed" >&2
              exit 1
            fi
            rm -rf -- "$tag_verify_dir"
          }
          verify_remote_tag

          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor \
            "$event_commit" "refs/remotes/origin/${DEFAULT_BRANCH}" || {
            echo "release commit is not reachable from the protected default branch" >&2
            exit 1
          }

      - name: Install the subject lock into the trusted control checkout
        run: install -m 0644 release-subject/sources.env sources.env

      - name: Restore locked source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/source-cache/downloads
          key: ffmpeg-static-sources-${{ runner.os }}-${{ hashFiles('sources.env') }}

      - name: Install source verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bzip2 \
            ca-certificates \
            curl \
            gnupg \
            xz-utils

      - name: Download and authenticate every locked input
        run: scripts/fetch-sources.sh win32-x64

      - name: Stage authenticated build and redistributable source inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC1091
          source sources.env
          core_dir=build/authenticated-core-sources
          toolchain_dir=build/authenticated-windows-toolchain
          source_dir=build/source-assets
          mkdir -p -- \
            "$core_dir" \
            "$toolchain_dir" \
            "$source_dir/.github/workflows" \
            "$source_dir/keys" \
            "$source_dir/licenses" \
            "$source_dir/scripts"
          install -m 0644 .github/actionlint.yaml \
            "$source_dir/.github/actionlint.yaml"
          for archive in \
            "$FFMPEG_ARCHIVE" \
            "$FFMPEG_SIGNATURE_ARCHIVE" \
            "$X264_ARCHIVE" \
            "$LAME_ARCHIVE" \
            "$NASM_ARCHIVE" \
            "$MUSL_ARCHIVE" \
            "$FORTIFY_HEADERS_ARCHIVE" \
            "$LLVM_MINGW_RECIPE_ARCHIVE"; do
            install -m 0644 "build/source-cache/downloads/${archive}" "$core_dir/"
            install -m 0644 "build/source-cache/downloads/${archive}" "$source_dir/"
          done
          install -m 0644 \
            "build/source-cache/downloads/${LLVM_RUNTIME_ARCHIVE}" \
            "$source_dir/${LLVM_RUNTIME_ARCHIVE}"
          install -m 0644 \
            "build/source-cache/downloads/${LLVM_MINGW_ARCHIVE}" \
            "$toolchain_dir/"
          install -m 0644 sources.env "$source_dir/sources.env"
          install -m 0644 sources.env "$core_dir/sources.env"
          install -m 0644 LICENSE "$source_dir/LICENSE"
          install -m 0644 keys/ffmpeg-release-signing-key.asc \
            "$source_dir/keys/ffmpeg-release-signing-key.asc"
          install -m 0644 keys/manifest-ed25519.pub "$source_dir/keys/manifest-ed25519.pub"
          for license in \
            FFmpeg-IJG-NOTICE.txt \
            GCC-RUNTIME-LIBRARY-EXCEPTION-3.1.txt \
            x264-x86inc-ISC.txt; do
            install -m 0644 "licenses/${license}" "$source_dir/licenses/${license}"
          done
          for script in \
            audit_workflow_actions.py \
            assemble-release.py \
            build.sh \
            common.sh \
            fetch-sources.sh \
            finalize_signing_grant.py \
            generate-third-party-notices.py \
            motrix-media-smoke.ps1 \
            motrix-media-smoke.sh \
            notarize-macos.sh \
            package-artifact.py \
            parse_pe_imports.py \
            pipeline_lib.py \
            resolve-signtool.ps1 \
            sign-macos.sh \
            sign_release_manifest.py \
            validate-notarization.py \
            validate_signing_input.py \
            verify_authenticode_delta.py \
            verify_macho_codesign_delta.py \
            verify-binary.sh; do
            install -m 0644 "scripts/${script}" "$source_dir/scripts/${script}"
          done
          for workflow in ci.yml dependency-audit.yml release.yml; do
            install -m 0644 ".github/workflows/${workflow}" \
              "$source_dir/.github/workflows/${workflow}"
          done

      - name: Upload authenticated core sources
        id: upload-core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-core-sources-${{ github.run_id }}
          path: build/authenticated-core-sources/
          if-no-files-found: error
          retention-days: 36
          compression-level: 0

      - name: Upload authenticated Windows toolchain
        id: upload-toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-windows-toolchain-${{ github.run_id }}
          path: build/authenticated-windows-toolchain/
          if-no-files-found: error
          retention-days: 36
          compression-level: 0

      - name: Upload redistributable source assets
        id: upload-sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redistributable-sources-${{ github.run_id }}
          path: build/source-assets/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 36
          compression-level: 0

  build:
    name: Build ${{ matrix.target }}
    needs: prepare-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            runner: macos-26
          - target: darwin-x64
            platform: darwin
            runner: macos-26-intel
          - target: linux-arm64
            platform: linux
            runner: ubuntu-22.04-arm
          - target: linux-x64
            platform: linux
            runner: ubuntu-22.04
          - target: win32-arm64
            platform: win32
            runner: ubuntu-22.04
          - target: win32-x64
            platform: win32
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bound authenticated core sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-sources.outputs.core-artifact-id }}
          path: build/source-cache/downloads
          digest-mismatch: error

      - name: Download bound authenticated Windows toolchain
        if: matrix.platform == 'win32'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-sources.outputs.toolchain-artifact-id }}
          path: build/source-cache/downloads
          digest-mismatch: error

      - name: Install the bound release lock
        run: install -m 0644 build/source-cache/downloads/sources.env sources.env

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            bzip2 \
            build-essential \
            ca-certificates \
            curl \
            file \
            gnupg \
            pkg-config \
            python3 \
            xz-utils

      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          test -x /usr/bin/python3
          /usr/bin/python3 -I -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 9) else 1)'
          brew install gnupg pkg-config
          python3 -I -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 9) else 1)'

      - name: Re-authenticate inputs, build, and verify
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/fetch-sources.sh "$TARGET"
          scripts/build.sh "$TARGET"
          scripts/verify-binary.sh "$TARGET"

      - name: Exercise native media operations before packaging
        if: ${{ matrix.platform != 'win32' }}
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ffmpeg="build/${TARGET}/payload/ffmpeg"
          ffprobe="build/${TARGET}/payload/ffprobe"
          smoke_dir=$(mktemp -d "${RUNNER_TEMP}/motrix-ffmpeg-smoke.XXXXXX")
          trap 'rm -rf -- "$smoke_dir"' EXIT
          scripts/motrix-media-smoke.sh "$ffmpeg" "$ffprobe" "$smoke_dir"

      - name: Package unsigned final candidate
        if: ${{ needs.prepare-sources.outputs.formal-release != 'true' || matrix.platform == 'linux' }}
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/package-artifact.py \
            --target "$TARGET" \
            --payload "build/${TARGET}/payload" \
            --build-info "build/${TARGET}/build-info.json" \
            --output-dir "build/packages/${TARGET}"

      - name: Upload final candidate
        if: ${{ needs.prepare-sources.outputs.formal-release != 'true' || matrix.platform == 'linux' }}
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: build/packages/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 36
          compression-level: 0

      - name: Record final candidate artifact binding
        if: ${{ needs.prepare-sources.outputs.formal-release != 'true' || matrix.platform == 'linux' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-release.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-release.outputs.artifact-id }}
          ARTIFACT_NAME: release-${{ matrix.target }}
          HEAD_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json, os, pathlib, re
          artifact_id = os.environ["ARTIFACT_ID"]
          digest = os.environ["ARTIFACT_DIGEST"].lower()
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("upload-artifact returned an invalid artifact identity")
          path = pathlib.Path("build/bindings") / f"{os.environ['TARGET']}.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "schemaVersion": 1,
              "target": os.environ["TARGET"],
              "artifactName": os.environ["ARTIFACT_NAME"],
              "artifactId": int(artifact_id),
              "artifactDigest": digest,
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "headSha": os.environ["HEAD_SHA"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload final candidate binding
        if: ${{ needs.prepare-sources.outputs.formal-release != 'true' || matrix.platform == 'linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binding-${{ matrix.target }}
          path: build/bindings/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 36

      - name: Stage exact signing input
        if: ${{ needs.prepare-sources.outputs.formal-release == 'true' && matrix.platform != 'linux' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="build/signing-input/${TARGET}"
          mkdir -p "$stage"
          cp -R "build/${TARGET}/payload" "$stage/payload"
          install -m 0644 "build/${TARGET}/build-info.json" "$stage/build-info.json"
          install -m 0644 sources.env "$stage/sources.env"
          if [[ "$PLATFORM" == win32 ]]; then
            mkdir -p "$stage/work/link-maps"
            for evidence in \
              ffmpeg.map \
              ffmpeg.link-trace.txt \
              ffprobe.map \
              ffprobe.link-trace.txt; do
              install -m 0644 \
                "build/${TARGET}/work/link-maps/${evidence}" \
                "$stage/work/link-maps/${evidence}"
            done
          fi

      - name: Upload signing input
        if: ${{ needs.prepare-sources.outputs.formal-release == 'true' && matrix.platform != 'linux' }}
        id: upload-signing-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-input-${{ matrix.target }}
          path: build/signing-input/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 36
          compression-level: 0

      - name: Record signing input artifact binding
        if: ${{ needs.prepare-sources.outputs.formal-release == 'true' && matrix.platform != 'linux' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-signing-input.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload-signing-input.outputs.artifact-id }}
          ARTIFACT_NAME: signing-input-${{ matrix.target }}
          HEAD_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json, os, pathlib, re
          artifact_id = os.environ["ARTIFACT_ID"]
          digest = os.environ["ARTIFACT_DIGEST"].lower()
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("upload-artifact returned an invalid artifact identity")
          path = pathlib.Path("build/signing-bindings") / f"{os.environ['TARGET']}.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "schemaVersion": 1,
              "target": os.environ["TARGET"],
              "artifactName": os.environ["ARTIFACT_NAME"],
              "artifactId": int(artifact_id),
              "artifactDigest": digest,
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "headSha": os.environ["HEAD_SHA"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload signing input binding
        if: ${{ needs.prepare-sources.outputs.formal-release == 'true' && matrix.platform != 'linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-input-binding-${{ matrix.target }}
          path: build/signing-bindings/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 36

  resolve-signing-inputs:
    name: Bind exact signing inputs
    if: needs.prepare-sources.outputs.formal-release == 'true'
    needs:
      - prepare-sources
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      darwin_arm64_id: ${{ steps.resolve.outputs.darwin_arm64_id }}
      darwin_arm64_digest: ${{ steps.resolve.outputs.darwin_arm64_digest }}
      darwin_x64_id: ${{ steps.resolve.outputs.darwin_x64_id }}
      darwin_x64_digest: ${{ steps.resolve.outputs.darwin_x64_digest }}
      win32_arm64_id: ${{ steps.resolve.outputs.win32_arm64_id }}
      win32_arm64_digest: ${{ steps.resolve.outputs.win32_arm64_digest }}
      win32_x64_id: ${{ steps.resolve.outputs.win32_x64_id }}
      win32_x64_digest: ${{ steps.resolve.outputs.win32_x64_digest }}
    steps:
      - name: Download darwin-arm64 binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-input-binding-darwin-arm64
          path: bindings/darwin-arm64
          digest-mismatch: error

      - name: Download darwin-x64 binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-input-binding-darwin-x64
          path: bindings/darwin-x64
          digest-mismatch: error

      - name: Download win32-arm64 binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-input-binding-win32-arm64
          path: bindings/win32-arm64
          digest-mismatch: error

      - name: Download win32-x64 binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-input-binding-win32-x64
          path: bindings/win32-x64
          digest-mismatch: error

      - name: Resolve upload IDs and digests against the run API
        id: resolve
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          targets = ("darwin-arm64", "darwin-x64", "win32-arm64", "win32-x64")
          run_id = int(os.environ["GITHUB_RUN_ID"])
          repository = os.environ["REPOSITORY"]

          def api(path: str) -> object:
              return json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repository}/{path}"], text=True
              ))

          expected_names = {
              *(f"signing-input-{target}" for target in targets),
              *(f"signing-input-binding-{target}" for target in targets),
          }
          listing = api(f"actions/runs/{run_id}/artifacts?per_page=100")
          run_artifacts = {
              item["name"] for item in listing["artifacts"]
              if item.get("workflow_run", {}).get("id") == run_id
              and item["name"].startswith("signing-input-")
          }
          if run_artifacts != expected_names:
              raise SystemExit(
                  f"signing artifact set mismatch: expected={sorted(expected_names)}, "
                  f"actual={sorted(run_artifacts)}"
              )

          output_lines = []
          for target in targets:
              directory = pathlib.Path("bindings") / target
              files = [path for path in directory.rglob("*") if path.is_file()]
              if len(files) != 1 or files[0].name != f"{target}.json" or files[0].is_symlink():
                  raise SystemExit(f"invalid binding artifact for {target}")
              record = json.loads(files[0].read_text(encoding="utf-8"))
              expected_keys = {
                  "schemaVersion", "target", "artifactName", "artifactId",
                  "artifactDigest", "runId", "headSha",
              }
              if set(record) != expected_keys:
                  raise SystemExit(f"invalid binding schema for {target}")
              if (
                  record["schemaVersion"] != 1
                  or record["target"] != target
                  or record["artifactName"] != f"signing-input-{target}"
                  or record["runId"] != run_id
                  or record["headSha"] != os.environ["EXPECTED_HEAD_SHA"]
                  or not isinstance(record["artifactId"], int)
                  or not re.fullmatch(r"[0-9a-f]{64}", record["artifactDigest"])
              ):
                  raise SystemExit(f"binding value mismatch for {target}")
              artifact = api(f"actions/artifacts/{record['artifactId']}")
              api_digest = str(artifact.get("digest", "")).removeprefix("sha256:").lower()
              workflow_run = artifact.get("workflow_run") or {}
              if (
                  artifact.get("name") != record["artifactName"]
                  or artifact.get("expired") is not False
                  or api_digest != record["artifactDigest"]
                  or workflow_run.get("id") != run_id
                  or workflow_run.get("head_sha") != record["headSha"]
              ):
                  raise SystemExit(f"artifact API binding mismatch for {target}")
              key = target.replace("-", "_")
              output_lines.extend((
                  f"{key}_id={record['artifactId']}",
                  f"{key}_digest={record['artifactDigest']}",
              ))
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(output_lines) + "\n")
          PY

  rebuild-signing-inputs:
    name: Independent clean rebuild ${{ matrix.target }}
    if: needs.prepare-sources.outputs.formal-release == 'true'
    needs: prepare-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            runner: macos-26
          - target: darwin-x64
            platform: darwin
            runner: macos-26-intel
          - target: win32-arm64
            platform: win32
            runner: ubuntu-22.04
          - target: win32-x64
            platform: win32
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out protected rebuild recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download bound authenticated core sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-sources.outputs.core-artifact-id }}
          path: build/source-cache/downloads
          digest-mismatch: error

      - name: Download bound authenticated Windows toolchain
        if: matrix.platform == 'win32'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-sources.outputs.toolchain-artifact-id }}
          path: build/source-cache/downloads
          digest-mismatch: error

      - name: Install the bound release lock
        run: install -m 0644 build/source-cache/downloads/sources.env sources.env

      - name: Install Linux rebuild prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            bzip2 \
            build-essential \
            ca-certificates \
            curl \
            file \
            gnupg \
            pkg-config \
            python3 \
            xz-utils

      - name: Install macOS rebuild prerequisites
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          test -x /usr/bin/python3
          /usr/bin/python3 -I -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 9) else 1)'
          brew install gnupg pkg-config
          python3 -I -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 9) else 1)'

      - name: Re-authenticate and independently rebuild
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/fetch-sources.sh "$TARGET"
          scripts/build.sh "$TARGET"
          scripts/verify-binary.sh "$TARGET"

      - name: Stage exact independent rebuild result
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
